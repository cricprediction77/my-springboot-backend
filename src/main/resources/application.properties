spring.application.name=predict-be

# Server Port (Render uses PORT env)
server.port=${PORT:8000}

# DB Connection (LOCAL default + Render override)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/CricPredict}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# ? Required for Supabase SSL
spring.datasource.hikari.data-source-properties.ssl=true
spring.datasource.hikari.data-source-properties.sslmode=require

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
